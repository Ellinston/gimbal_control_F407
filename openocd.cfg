source [find interface/stlink.cfg]
# Older OpenOCD packages use HLA; newer packages use the native ST-Link driver.
if { [adapter name] eq "hla" } {
    transport select hla_swd
} else {
    transport select swd
}
source [find target/stm32f4x.cfg]
# Keep the reset clock state for the application's SystemClock_Config().
# The upstream reset-init hook selects a 64 MHz PLL, which HAL cannot replace
# while it is SYSCLK; this project's SystemInit() does not reset RCC registers.
$_TARGETNAME configure -event reset-init {
    adapter speed 1000
}
adapter speed 1000
reset_config none
